model_list:
  - model_name: claude-opus-4.7
    litellm_params:
      model: bedrock/converse/arn:aws:bedrock:ap-south-1:426628337772:application-inference-profile/96j5zamnqlci
      aws_region_name: ap-south-1
      thinking: {"type": "adaptive", "display": "summarized"}
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: bedrock/converse/arn:aws:bedrock:ap-south-1:426628337772:application-inference-profile/xv71vnlzm71s
      aws_region_name: ap-south-1
      thinking: {"type": "adaptive", "display": "summarized"}
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
  - model_name: gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
      reasoning_effort: {"effort": "high", "summary": "detailed"}
      stream_options:
        include_usage: true
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.00003
litellm_settings:
  drop_params: true
  modify_params: true
  telemetry: false
  num_retries: 1
  request_timeout: 900
  stream_timeout: 60
  reasoning_auto_summary: true
  callbacks: ["litellm_usage_callback.proxy_handler_instance"]
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false
